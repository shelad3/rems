  cloud_functions: ^5.3.4
  flutter_riverpod: ^2.6.1
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  intl: ^0.20.2
  shimmer: ^3.0.0
  flutter_local_notifications: ^18.0.1
  share_plus: ^10.1.4
